    <section>
        <h1 class="h1-top-section">Modulo di contatto</h1>
        <form action="https://api.web3forms.com/submit" method="POST">
            <!--nasconde indirizzo email-->
            <input type="hidden" name="access_key" value="2e6577ab-7cce-448f-b2d2-7f24ecb74edc">
            
            <!--oggetto email-->
            <input type="hidden" name="subject" value="Nuovo messaggio dal tuo sito">
            
            <!--pagina di ringraziamento-->
            <input type="hidden" name="redirect" value="https://fbars-dev.github.io/archibars/grazie-per-averci-contattato.html">

            <!--honeypot (anti-bot)-->
            <input type="checkbox" name="botcheck" style="display:none">

            <label for="fname">Nome
                <input type="text" id="fname" name="Nome" required>
            </label>
            <label for="lname">Cognome
                <input type="text" id="lname" name="Cognome">
            </label>
            <label for="phone">Telefono
                <input type="tel" id="phone" name="Telefono">
            </label>
            <label for="email">Email
                <input type="email" id="email" name="Email" required>
            </label>
            <label for="reason">Per quale ragione ci stai contattando?
                <textarea id="reason" name="Motivo del contatto" rows="3"></textarea>
            </label>

            <!--hCaptcha (anti-bot)-->
            <div class="h-captcha" data-captcha="true"></div>

            <input type="submit" value="INOLTRA">
        </form>
